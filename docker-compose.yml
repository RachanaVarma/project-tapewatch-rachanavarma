services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-tapewatch}
      POSTGRES_USER: ${DB_USER:-tapewatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tapewatch}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tapewatch} -d ${DB_NAME:-tapewatch}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tapewatch}
      DB_NAME: ${DB_NAME:-tapewatch}
      DB_USER: ${DB_USER:-tapewatch}
      DB_PASSWORD: ${DB_PASSWORD:-tapewatch}
      MASKING_SECRET: ${MASKING_SECRET:-local-development-secret-change-before-deploy}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
